};
IO.dateStamp = function () {
  var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
};
IO.download = function (blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
};

/* ---------- 表格导出（当前网段 → 行） ---------- */
IO.tableHeaders = function () {
  return ['IP', '状态', '设备名称', '主机名', '管理IP', '使用接口', 'MAC地址', '用途', '设备类型', '备注', '网段'];
};
IO.subnetRows = function (s) {
  var info = Calc.parseCidr(s.cidr);
  var rows = [];
  for (var i = 0; i < info.total; i++) {
    var ip = Calc.idxToIp(info.network, i);
    var rec = s.ips[ip];
    if (!rec) continue;
    rows.push([
      ip,
      STATUS_LABEL[rec.status] || rec.status || '',
      rec.name || '', rec.hostname || '', rec.mgmtIp || '', rec.iface || '', rec.mac || '',
      rec.purpose || '', DEVTYPE_LABEL[rec.deviceType] || rec.deviceType || '',
      rec.note || '', s.cidr
    ]);
  }
  return rows;
};
IO.allRows = function () {
  var rows = [];
  Store.state.data.subnets.forEach(function (s) {
    IO.subnetRows(s).forEach(function (r) { rows.push(r); });
  });
  return rows;
};
IO.exportTable = function (fmt) {
  var headers = IO.tableHeaders();
  var rows = IO.allRows();
  if (!rows.length) { toast('没有登记记录可导出', { err: true }); return; }
  var name = 'ip-registry-' + IO.dateStamp();
  if (fmt === 'xlsx') {
    IO.Xlsx.write([[headers].concat(rows)], name + '.xlsx');
    toast('已导出 xlsx（' + rows.length + ' 行）');
  } else {
    IO.download(new Blob(['﻿' + IO.csvEncode([headers].concat(rows))], { type: 'text/csv' }), name + '.csv');
    toast('已导出 CSV（' + rows.length + ' 行）');
  }
};

/* ---------- CSV ---------- */
IO.csvEncode = function (rows) {
  return rows.map(function (row) {
    return row.map(function (cell) {
      cell = String(cell == null ? '' : cell);
      if (/[",\r\n]/.test(cell)) cell = '"' + cell.replace(/"/g, '""') + '"';
      return cell;
    }).join(',');
  }).join('\r\n');
};
IO.csvParse = function (text) {
  // 状态机：处理引号内逗号/换行/转义
  var rows = [], row = [], cell = '', i = 0, inQ = false;
  text = text.replace(/^﻿/, '');
  while (i < text.length) {
    var ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cell += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      cell += ch; i++; continue;
    }
    if (ch === '"' && cell === '') { inQ = true; i++; continue; }
    if (ch === ',') { row.push(cell); cell = ''; i++; continue; }
    if (ch === '\r') { i++; continue; }
    if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; continue; }
    cell += ch; i++;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
};
IO.decodeText = function (buf) {
  // 优先 UTF-8；大量替换符则回退 GBK（中文 Windows Excel 导出 CSV 常见）
  var utf8 = new TextDecoder('utf-8').decode(buf);
  if (!/�/.test(utf8)) return utf8;
  try { return new TextDecoder('gbk').decode(buf); } catch (e) { return utf8; }
};

/* ---------- Mini-XLSX 读取器 ----------
 * 依赖 DecompressionStream('deflate-raw') + DOMParser
 * 返回 { sheets: [{name, rows: [[cell,...],...]}] }
 */
IO.Xlsx = {};
// read 返回 Promise<{sheets:[{name, rows}]}>（zip 解压为异步）
IO.Xlsx.read = function (buf) {
  if (!IO.hasDecompress) {
    return Promise.reject(new Error('当前浏览器不支持 xlsx 解压（需 Edge/Chrome ≥ 103），请改用 CSV 导入或升级浏览器'));
  }
  var u8 = new Uint8Array(buf);
  return IO.Xlsx.parseZip(u8).then(function (entries) {
    return IO.Xlsx._readFromEntries(entries);
  });
};
IO.Xlsx._readFromEntries = function (entries) {
  var get = function (name) {
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].name === name) return entries[i];
    }
    return null;
  };
  var wb = get('xl/workbook.xml');
  if (!wb) throw new Error('不是有效的 .xlsx 文件（缺少 workbook.xml），文件可能已加密');
  var wbDoc = new DOMParser().parseFromString(IO.Xlsx.utf8Text(wb.data), 'application/xml');
  var rels = get('xl/_rels/workbook.xml.rels');
  var relMap = {};
  if (rels) {
    var relDoc = new DOMParser().parseFromString(IO.Xlsx.utf8Text(rels.data), 'application/xml');
    relDoc.querySelectorAll('Relationship').forEach(function (r) {
      relMap[r.getAttribute('Id')] = r.getAttribute('Target').replace(/^\//, '');
    });
  }
  var sheets = [];
  var sst = [];
  var ssEntry = get('xl/sharedStrings.xml');
  if (ssEntry) {
    var ssDoc = new DOMParser().parseFromString(IO.Xlsx.utf8Text(ssEntry.data), 'application/xml');
    ssDoc.querySelectorAll('si').forEach(function (si) {
      var t = '';
      si.querySelectorAll('t').forEach(function (x) { t += x.textContent; });
      sst.push(t);
    });
  }
  wbDoc.querySelectorAll('sheet').forEach(function (sh) {
    var rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    var target = relMap[rid] || '';
    if (/^\//.test(target)) target = target.slice(1);
    else if (!/^xl\//.test(target)) target = 'xl/' + target;
    var e = get(target);
    if (!e) return;
    var xml = new DOMParser().parseFromString(IO.Xlsx.utf8Text(e.data), 'application/xml');
    sheets.push({ name: sh.getAttribute('name') || target, rows: IO.Xlsx.readSheet(xml, sst) });
  });
  if (!sheets.length) throw new Error('xlsx 中未找到工作表');
  return { sheets: sheets };
};
IO.Xlsx.utf8Text = function (u8) { return new TextDecoder('utf-8').decode(u8); };
IO.Xlsx.parseZip = function (u8) {
  // 扫描 EOCD → 中央目录 → 逐条目定位局部头取数据
  var EOCD_SIG = 0x06054b50, CD_SIG = 0x02014b50;
  var eocd = -1;
  for (var i = u8.length - 22; i >= Math.max(0, u8.length - 65558); i--) {
    if (u8[i] === 0x50 && u8[i + 1] === 0x4b && u8[i + 2] === 0x05 && u8[i + 3] === 0x06) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('无效的 zip 文件（未找到 EOCD）');
  var dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  var count = dv.getUint16(eocd + 10, true);
  var cdOff = dv.getUint32(eocd + 16, true);
  var entries = [];
  var p = cdOff;
  for (var n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== CD_SIG) break;
    var method = dv.getUint16(p + 10, true);
    var csize = dv.getUint32(p + 20, true);
    var nameLen = dv.getUint16(p + 28, true);
    var extraLen = dv.getUint16(p + 30, true);
    var cmtLen = dv.getUint16(p + 32, true);
    var lho = dv.getUint32(p + 42, true);
    var name = '';
    for (var c = 0; c < nameLen; c++) name += String.fromCharCode(u8[p + 46 + c]);
    // 局部头：30 字节 + 名长 + 扩展长
    var lNameLen = dv.getUint16(lho + 26, true);
    var lExtraLen = dv.getUint16(lho + 28, true);
    var dataStart = lho + 30 + lNameLen + lExtraLen;
    var raw = u8.subarray(dataStart, dataStart + csize);
    entries.push({ name: name, method: method, data: method === 0 ? raw.slice() : null, compressed: method === 8 ? raw : null });
    p += 46 + nameLen + extraLen + cmtLen;
  }
  // 解压 DEFLATE 条目（异步 → 全部完成后返回）
  return IO.Xlsx._inflateAll(entries);
};
IO.Xlsx._inflateAll = function (entries) {
  var jobs = [];
  entries.forEach(function (e) {
    if (e.method === 0 || !e.compressed) return;
    jobs.push(new Response(new Blob([e.compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw')))
      .arrayBuffer().then(function (ab) { e.data = new Uint8Array(ab); }));
  });
  return Promise.all(jobs).then(function () { return entries; });
};
IO.Xlsx.readSheet = function (xml, sst) {
  var rows = [];
  var maxCols = 0;
  xml.querySelectorAll('sheetData > row').forEach(function (rowEl) {
    var cells = [];
    rowEl.querySelectorAll('c').forEach(function (cEl) {
      var ref = cEl.getAttribute('r') || '';
      var m = /^([A-Z]+)(\d+)$/.exec(ref);
      var col = m ? IO.Xlsx.colToIdx(m[1]) : cells.length;
      var t = cEl.getAttribute('t');
      var val = '';
      if (t === 's') {
        var vEl = cEl.querySelector('v');
        val = vEl ? (sst[+vEl.textContent] || '') : '';
      } else if (t === 'inlineStr') {
        var tt = '';
        cEl.querySelectorAll('t').forEach(function (x) { tt += x.textContent; });
        val = tt;
      } else {
        var v = cEl.querySelector('v');
        val = v ? v.textContent : '';
      }
      cells[col] = val;
    });
    // 行尾缺失的列不产出 <c> 元素 —— 以全表最大列数补齐，保证每行列数一致
    if (cells.length > maxCols) maxCols = cells.length;
    var dense = [];
    for (var i = 0; i < maxCols; i++) dense.push(cells[i] == null ? '' : cells[i]);
    rows.push(dense);
  });
  // 二次遍历：先前行短于最终 maxCols 的补齐
  rows.forEach(function (r) {
    while (r.length < maxCols) r.push('');
  });
  return rows;
};
IO.Xlsx.colToIdx = function (letters) {
  var n = 0;
  for (var i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
  return n - 1;
};

/* ---------- Mini-XLSX 写出器（STORE zip + CRC32） ---------- */
IO.Xlsx.crcTable = (function () {
  var t = [], c, k, n;
  for (n = 0; n < 256; n++) {
    c = n;
    for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
IO.Xlsx.crc32 = function (u8) {
  var c = 0xFFFFFFFF;
  for (var i = 0; i < u8.length; i++) c = IO.Xlsx.crcTable[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
};
IO.Xlsx.write = function (sheetsArr, filename) {
  // sheetsArr: [{name, rows}] → 最小合法 xlsx（inline string，STORE zip）
  var files = [];
  var contentTypes = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">',
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>',
    '<Default Extension="xml" ContentType="application/xml"/>',
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'];
  var wbSheets = '', rels = '';
  sheetsArr.forEach(function (sh, i) {
    var id = i + 1;
    files.push(['xl/worksheets/sheet' + id + '.xml', IO.Xlsx.sheetXml(sh.rows)]);
    contentTypes.push('<Override PartName="/xl/worksheets/sheet' + id + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>');
    wbSheets += '<sheet name="' + IO.Xlsx.xesc(sh.name || ('Sheet' + id)) + '" sheetId="' + id + '" r:id="rId' + id + '"/>';
    rels += '<Relationship Id="rId' + id + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + id + '.xml"/>';
  });
  contentTypes.push('</Types>');
  files.unshift(
    ['[Content_Types].xml', contentTypes.join('')],
    ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + wbSheets + '</sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + rels + '</Relationships>']
  );
  var zip = IO.Xlsx.zipStore(files);
  IO.download(new Blob([zip], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), filename);
};
IO.Xlsx.xesc = function (s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
};
IO.Xlsx.sheetXml = function (rows) {
  var xml = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'];
  rows.forEach(function (row, r) {
    xml.push('<row r="' + (r + 1) + '">');
    row.forEach(function (cell, c) {
      if (cell == null || cell === '') return;
      var ref = IO.Xlsx.idxToCol(c) + (r + 1);
      if (typeof cell === 'number' && isFinite(cell)) {
        xml.push('<c r="' + ref + '"><v>' + cell + '</v></c>');
      } else {
        xml.push('<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + IO.Xlsx.xesc(cell) + '</t></is></c>');
      }
    });
    xml.push('</row>');
  });
  xml.push('</sheetData></worksheet>');
  return xml.join('');
};
IO.Xlsx.idxToCol = function (n) {
  var s = '';
  n = n + 1;
  while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - 1 - m) / 26; }
  return s;
};
IO.Xlsx.zipStore = function (files) {
  // files: [[name, str]] → Uint8Array zip（全部 STORE）
  var enc = new TextEncoder();
  var parts = [], central = [], offset = 0;
  files.forEach(function (f) {
    var nameU8 = enc.encode(f[0]);
    var dataU8 = enc.encode(f[1]);
    var crc = IO.Xlsx.crc32(dataU8);
    var lh = new Uint8Array(30 + nameU8.length);
    var dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);        // version
    dv.setUint16(8, 0, true);         // method STORE
    dv.setUint16(10, 0, true); dv.setUint16(12, 0, true); // time/date
    dv.setUint32(14, crc, true);
    dv.setUint32(18, dataU8.length, true);
    dv.setUint32(22, dataU8.length, true);
    dv.setUint16(26, nameU8.length, true);
    lh.set(nameU8, 30);
    parts.push(lh, dataU8);
    central.push({ name: nameU8, crc: crc, size: dataU8.length, off: offset });
    offset += lh.length + dataU8.length;
  });
  var cdStart = offset;
  var cdSize = 0;
  central.forEach(function (e) {
    var ch = new Uint8Array(46 + e.name.length);
    var dv = new DataView(ch.buffer);
    dv.setUint32(0, 0x02014b50, true);
    dv.setUint16(4, 20, true); dv.setUint16(6, 20, true);
    dv.setUint16(10, 0, true);         // STORE
    dv.setUint32(16, e.crc, true);
    dv.setUint32(20, e.size, true); dv.setUint32(24, e.size, true);
    dv.setUint16(28, e.name.length, true);
    dv.setUint32(42, e.off, true);
    ch.set(e.name, 46);
    parts.push(ch);
    cdSize += ch.length;
    offset += ch.length;
  });
  var eocd = new Uint8Array(22);
  var dv2 = new DataView(eocd.buffer);
  dv2.setUint32(0, 0x06054b50, true);
  dv2.setUint16(8, central.length, true);
  dv2.setUint16(10, central.length, true);
  dv2.setUint32(12, cdSize, true);
  dv2.setUint32(16, cdStart, true);
  parts.push(eocd);
  var total = 0;
  parts.forEach(function (p) { total += p.length; });
  var out = new Uint8Array(total);
  var pos = 0;
  parts.forEach(function (p) { out.set(p, pos); pos += p.length; });
  return out;
};

var Wizard = {};

Wizard.open = function (file) {
  var ext = file.name.toLowerCase().split('.').pop();
  $('#w-err').textContent = '';
  if (ext === 'xlsx') {
    if (!IO.hasDecompress) {
      toast('当前浏览器不支持 xlsx 解压，请改用 CSV 导入或升级浏览器', { err: true, ms: 6000 });
      return;
    }
    var fr = new FileReader();
    fr.onload = function () {
      IO.Xlsx.read(fr.result).then(function (wb) {
        Wizard.start(wb.sheets);
      }).catch(function (e) {
        toast('读取 xlsx 失败：' + e.message, { err: true, ms: 6000 });
      });
    };
    fr.readAsArrayBuffer(file);
  } else if (ext === 'csv') {
    var fr2 = new FileReader();
    fr2.onload = function () {
      var rows = IO.csvParse(IO.decodeText(fr2.result));
      Wizard.start([{ name: file.name, rows: rows }]);
    };
    fr2.readAsArrayBuffer(file);
  } else {
    toast('仅支持 .xlsx / .csv 文件', { err: true });
  }
};

Wizard.autoMap = function (headers) {
  // 表头关键词自动猜测映射
  var guess = {};
  var rules = [
    [/^ip$|ip地址|^地址$|ip addr/i, 'ip'],
    [/主机名|hostname|域名|domain/i, 'hostname'],
    [/设备名|名称|name|设备/i, 'name'],
    [/管理ip|管理|mgmt|管理地址/i, 'mgmtIp'],
    [/接口|port|iface|interface/i, 'iface'],
    [/mac|物理地址/i, 'mac'],
    [/用途|目的|用途说明|purpose|描述/i, 'purpose'],
    [/类型|设备类型|type|device/i, 'deviceType'],
    [/备注|说明|note|remark|comment/i, 'note'],
    [/状态|status/i, 'status'],
    [/网段|cidr|subnet|vlan/i, 'subnet']
  ];
  headers.forEach(function (h, i) {
    if (!h) return;
    for (var r = 0; r < rules.length; r++) {
      if (rules[r][0].test(String(h).trim())) {
        if (!(rules[r][1] in guess) && rules[r][1] !== 'ip' || !(rules[r][1] in guess)) {
          guess[rules[r][1]] = i;
        }
        break;
      }
    }
  });
  return guess;
};

Wizard.run = function () {
  var st = Wizard.state;
  st.merge = $('#w-merge') ? $('#w-merge').value : 'merge';
  var m = st.mapping;
  var kw = Data.loadKeywords();
  var stats = { added: 0, updated: 0, skipped: 0, outOfRange: [], newSubnets: 0, badIp: 0 };
  Data.backupCurrent();

  st.dataRows.forEach(function (row) {
    var get = function (key) {
      var i = m[key];
      return i == null ? '' : String(row[i] == null ? '' : row[i]).trim();
    };
    var ipStr = get('ip');
    if (!ipStr) { stats.badIp++; return; }
    var rec = { name: get('name'), hostname: get('hostname'), mgmtIp: get('mgmtIp'), iface: get('iface'), mac: get('mac'), purpose: get('purpose'), deviceType: get('deviceType'), note: get('note'), status: get('status') };
    // 「并入备注」列：以「表头: 值」拼接进 note
    if (st.noteCols && st.noteCols.length) {
      var extra = st.noteCols.map(function (ci) {
        var h = st.headers[ci] || ('列' + (ci + 1));
        var v = String(row[ci] == null ? '' : row[ci]).trim();
        return v ? h + ': ' + v : '';
      }).filter(Boolean).join('；');
      if (extra) rec.note = rec.note ? rec.note + '；' + extra : extra;
    }
    // 状态归一（使用可编辑规则表）
    if (rec.status) {
      var low = rec.status.toLowerCase();
      var mapped = null;
      if (/assigned|used|active/.test(low)) mapped = 'assigned';
      else if (/reserved/.test(low)) mapped = 'reserved';
      else if (/conflict|error/.test(low)) mapped = 'conflict';
      else {
        for (var r = 0; r < kw.length; r++) {
          if (kw[r][0].test(rec.status)) { mapped = kw[r][1]; break; }
        }
      }
      rec.status = mapped || 'assigned';
    }
    // 设备类型中文 → key
    if (rec.deviceType) {
      var hit = null;
      Object.keys(DEVTYPE_LABEL).forEach(function (k) {
        if (DEVTYPE_LABEL[k] && DEVTYPE_LABEL[k] === rec.deviceType) hit = k;
      });
      rec.deviceType = hit || (DEVTYPE_LABEL[rec.deviceType] ? rec.deviceType : 'other');
    }
    // 确定目标网段
    var cidr = st.subnetCidr || get('subnet');
    if (!cidr) { stats.outOfRange.push(ipStr + '（未指定网段）'); return; }
    var subnet = null;
    for (var i = 0; i < Store.state.data.subnets.length; i++) {
      if (Store.state.data.subnets[i].cidr === cidr) { subnet = Store.state.data.subnets[i]; break; }
    }
    if (!subnet) {
      try {
        var norm = Calc.normalizeCidr(cidr);
        subnet = { id: uid('snt'), name: norm, cidr: norm, vlan: '', note: '导入自动创建', createdAt: nowIso(), updatedAt: nowIso(), ips: {} };
        Store.state.data.subnets.push(subnet);
        stats.newSubnets++;
      } catch (e) {
        stats.outOfRange.push(ipStr + '（网段「' + cidr + '」无效）');
        return;
      }
    }
    var info;
    try { info = Calc.parseCidr(subnet.cidr); } catch (e) { stats.outOfRange.push(ipStr); return; }
    // IP 可能带掩码（192.168.1.5/24）
    ipStr = ipStr.split('/')[0].trim();
    if (Calc.idxOfIp(ipStr, info.network, info.broadcast) < 0) {
      stats.outOfRange.push(ipStr + '（不属于 ' + subnet.cidr + '）');
      return;
    }
    var exist = subnet.ips[ipStr];
    if (exist && st.merge === 'skip') { stats.skipped++; return; }
    var patch = {};
    ['name', 'hostname', 'mgmtIp', 'iface', 'mac', 'purpose', 'deviceType', 'note'].forEach(function (f) {
      if (rec[f]) patch[f] = rec[f];
    });
    patch.status = rec.status || (exist ? exist.status : 'assigned');
    var merged = Object.assign({}, exist || {}, patch);
    var hasField = FIELDS.some(function (f) { return merged[f]; });
    if (hasField || (merged.status && merged.status !== 'free')) {
      merged.updatedAt = nowIso();
      subnet.ips[ipStr] = merged;
      if (exist) stats.updated++; else stats.added++;
    }
  });

  Store.persist();
  Store.emit();
  $('#wiz').close();
  var msg = '导入完成：新增 ' + stats.added + '，更新 ' + stats.updated
    + (stats.skipped ? '，跳过 ' + stats.skipped : '')
    + (stats.newSubnets ? '，新建网段 ' + stats.newSubnets : '')
    + (stats.badIp ? '，无效行 ' + stats.badIp : '');
  if (stats.outOfRange.length) {
    msg += '，越界/异常 ' + stats.outOfRange.length + ' 条';
  }
  toast(msg, { err: stats.outOfRange.length > 0, ms: 6000 });
  // 明细报告：越界/异常行可查看并复制
  if (stats.outOfRange.length || stats.badIp) {
    var lines = stats.outOfRange.slice();
    if (stats.badIp) lines.push('（另有 ' + stats.badIp + ' 行 IP 列为空，已忽略）');
    var detail = lines.join('\n');
    Dialog.confirm('导入明细：' + lines.length + ' 条未导入',
      '<div class="import-report-label">以下行未导入（越界/网段无效/IP 为空）：</div>'
      + '<pre id="io-detail" class="import-report">' + esc(detail) + '</pre>',
      function () {
        var text = $('#io-detail').textContent;
        var done = function () { toast('明细已复制到剪贴板'); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { IO.fallbackCopy(text); done(); });
        else { IO.fallbackCopy(text); done(); }

  }

      if (!reason && (status === 'network' || status === 'broadcast')) reason = '网络/广播地址不创建 IP 对象';
      if (!reason && valid) {
        var roleInfo = null;
        try { roleInfo = Calc.parseCidr(subnet.cidr); } catch (e2) {}
        if (roleInfo && Calc.roleOf(Calc.idxOfIp(ip, roleInfo.network, roleInfo.broadcast), roleInfo.total, roleInfo.pre) !== 'host') {
          reason = '网络/广播地址不创建 IP 对象';
        }
      }
      if (!reason && status === 'conflict' && NetBox.state.conflictMode === 'skip') reason = '冲突状态未选择远端映射策略';
      var payload = valid ? NetBox.buildIpPayload(ip, rec, NetBox.state.conflictMode) : {};
      if (!payload.status && !reason) reason = '状态没有可用的 NetBox 映射';
      var iHits = ipByKey[ip] || [];
      var iLinked = NetBox.remoteIdMatch(remote.ips, rec._netbox);
      var iLinkMismatch = iLinked && NetBox.addressOnly(iLinked.address) !== ip;
      if (iLinkMismatch) iLinked = null;
      var iExisting = iLinked || (iHits.length === 1 ? iHits[0] : null);
      if (iLinkMismatch) reason = '本地保存的 NetBox ID 与 IP 不一致，已跳过';
      else if (!iLinked && iHits.length > 1) reason = 'NetBox 中存在多个相同 IP，已跳过';
      var iItem = NetBox.classify('ip', { subnet: subnet, ip: ip, record: rec }, payload, iExisting, reason);
      iItem.key = ip; plan.ips.push(iItem);
    });
  });
  plan.unsupported = Object.keys(unsupportedFields);
  plan.counts = NetBox.planCounts(plan);
  return plan;
};
NetBox.planCounts = function (plan) {
  var c = { create: 0, update: 0, same: 0, skip: 0, prefixes: 0, ips: 0 };
  ['prefixes', 'ips'].forEach(function (kind) {
    plan[kind].forEach(function (item) { c[item.action]++; c[kind]++; });
  });
  c.writes = c.create + c.update;
  return c;
};
NetBox.itemName = function (item) {
  return item.key;
};
NetBox.changeText = function (item) {
  if (item.action === 'skip') return item.reason || '跳过';
  if (!item.changes.length) return '无字段变化';
  return item.changes.map(function (d) {
    var label = NetBox.fieldLabels[d.key] || d.key;
    if (item.action === 'create') return label + '=' + (d.newValue || '（空）');
    return label + ': ' + (d.oldValue || '（空）') + ' → ' + (d.newValue || '（空）');

};
NetBox.renderDiffTable = function (title, items) {
  var visible = items.filter(function (x) { return x.action !== 'same'; });
  var html = '<div class="nb-section"><h4>' + title + '（' + visible.length + ' 项差异）</h4>';
  if (!visible.length) return html + '<div class="nb-empty">无新增、更新或跳过项</div></div>';
  var shown = visible.slice(0, 400);
  html += '<div class="nb-table-wrap"><table class="nb-table"><thead><tr><th>对象</th><th>操作</th><th>字段变化</th></tr></thead><tbody>';
  html += shown.map(function (item) {
    return '<tr><td><code>' + esc(NetBox.itemName(item)) + '</code></td><td class="nb-action ' + item.action + '">' + NetBox.actionLabels[item.action] + '</td><td>' + esc(NetBox.changeText(item)) + '</td></tr>';
  }).join('');
  html += '</tbody></table></div>';
  if (visible.length > shown.length) html += '<div class="nb-details">仅显示前 ' + shown.length + ' 项，实际同步仍会处理全部差异。</div>';

};
NetBox.renderPreview = function () {
  var p = NetBox.state.plan, c = p.counts;
  var warnings = [];
  if (p.unsupported.length) warnings.push('本阶段未同步字段：' + p.unsupported.join('、') + '。它们仍保留在 IPViewer 本地数据中。');
  var conflictCount = p.ips.filter(function (x) { return x.local.record.status === 'conflict'; }).length;
  if (conflictCount && NetBox.state.conflictMode === 'skip') warnings.push('有 ' + conflictCount + ' 个冲突地址被跳过；如需写入，请返回选择 deprecated 策略。');

    + '<div class="nb-kpi"><b>' + c.update + '</b><span>更新</span></div>'

    + '<div class="nb-kpi"><b>' + c.skip + '</b><span>跳过</span></div></div>'
    + '<div class="nb-status ok">已读取远端：' + p.remote.prefixes.length + ' 个网段，' + p.remote.ips.length + ' 个 IP 地址。IPv4 主机地址按 /32 写入。</div>';
  if (warnings.length) body += '<div class="nb-warning"><strong>同步边界</strong><br>' + warnings.map(esc).join('<br>') + '</div>';

  var close = document.createElement('button'); close.className = 'btn'; close.textContent = '关闭'; close.onclick = function () { $('#netbox').close(); };
  foot.appendChild(back); foot.appendChild(close);

};
NetBox.renderSync = function () {
  $('#nb-body').innerHTML = '<div class="nb-intro">正在执行已确认的批量请求。每个 NetBox 资源批次独立提交，完成后会显示成功和失败明细。</div><div class="nb-status">' + esc(NetBox.state.progress || '准备中…') + '</div>';
  var foot = $('#nb-foot'); foot.innerHTML = '';
  var cancel = document.createElement('button'); cancel.className = 'btn'; cancel.textContent = '关闭'; cancel.disabled = true; foot.appendChild(cancel);
};
NetBox.jobs = function (plan) {
  return [
    { kind: 'prefix', action: 'create', method: 'POST', endpoint: 'ipam/prefixes/', items: plan.prefixes.filter(function (x) { return x.action === 'create'; }) },
    { kind: 'prefix', action: 'update', method: 'PATCH', endpoint: 'ipam/prefixes/', items: plan.prefixes.filter(function (x) { return x.action === 'update'; }) },
    { kind: 'ip', action: 'create', method: 'POST', endpoint: 'ipam/ip-addresses/', items: plan.ips.filter(function (x) { return x.action === 'create'; }) },
    { kind: 'ip', action: 'update', method: 'PATCH', endpoint: 'ipam/ip-addresses/', items: plan.ips.filter(function (x) { return x.action === 'update'; }) }
  ].filter(function (job) { return job.items.length; });
};
NetBox.responseRows = function (data) {
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.results)) return data.results;
  return [];
};
NetBox.linkResponse = function (job, response) {
  var rows = NetBox.responseRows(response);
  var keyOf = function (row) { return job.kind === 'prefix' ? NetBox.normalizedPrefix(row && row.prefix) : NetBox.addressOnly(row && row.address); };
  job.items.forEach(function (item, index) {
    var remote = rows[index] || null;
    if (remote && keyOf(remote) !== item.key) remote = null;
    if (!remote) {
      remote = rows.filter(function (x) { return keyOf(x) === item.key; })[0] || item.existing;
    }
    if (!remote || !remote.id) return;
    var link = { id: remote.id, url: remote.url || '' , syncedAt: nowIso() };
    if (job.kind === 'prefix') item.local._netbox = link;
    else item.local.record._netbox = link;
  });
};
NetBox.execute = function () {
  var plan = NetBox.state.plan, jobs = NetBox.jobs(plan);
  if (!jobs.length) return;
  NetBox.state.step = 'sync';
  NetBox.state.result = { success: [], failures: [] };
  NetBox.renderSync();
  function run(index) {
    if (index >= jobs.length) return NetBox.finishSync();
    var job = jobs[index];
    NetBox.state.progress = '正在' + (job.action === 'create' ? '新增' : '更新') + ' ' + (job.kind === 'prefix' ? '网段' : 'IP 地址') + '（' + job.items.length + ' 项）…';
    NetBox.renderSync();
    var payload = job.items.map(function (item) {
      var p = Object.assign({}, item.payload);
      if (job.action === 'update') p.id = item.existing.id;
      return p;
    });
    NetBox.request(job.endpoint, { method: job.method, body: JSON.stringify(payload) }).then(function (data) {
      NetBox.linkResponse(job, data);
      NetBox.state.result.success.push({ job: job, count: job.items.length });
      run(index + 1);
    }).catch(function (e) {
      NetBox.state.result.failures.push({ job: job, message: e.message });
      run(index + 1);
    });
  }
  run(0);
};
NetBox.finishSync = function () {
  var result = NetBox.state.result;
  Store.persist();
  Store.emit();
  NetBox.state.step = 'result';
  var success = result.success.reduce(function (n, x) { return n + x.count; }, 0);
  var body = '<div class="nb-result ' + (result.failures.length ? 'error' : 'ok') + '"><strong>同步完成</strong><br>成功处理 ' + success + ' 项' + (result.failures.length ? '，' + result.failures.length + ' 个批次失败。' : '。') + '</div>';
  if (result.failures.length) body += '<div class="nb-error">' + result.failures.map(function (x) { return esc((x.job.kind === 'prefix' ? '网段' : 'IP 地址') + ' ' + (x.job.action === 'create' ? '新增' : '更新') + '：' + x.message); }).join('\n') + '</div>';
  body += '<div class="nb-details">远端 ID 和 URL 已写入本地记录，Token 未保存。失败批次不会自动重试，可返回配置重新读取现状。</div>';
  $('#nb-body').innerHTML = body;
  var foot = $('#nb-foot'); foot.innerHTML = '';
  var close = document.createElement('button'); close.className = 'btn primary'; close.textContent = '完成'; close.onclick = function () { $('#netbox').close(); };
  foot.appendChild(close);
  toast(result.failures.length ? 'NetBox 同步部分完成，请查看失败明细' : 'NetBox 同步完成', { err: !!result.failures.length, ms: 6000 });
};

/* ============================================================
 * [10] Events —— 事件层（document 级事件委托）

var Events = {};
Events.init = function () {
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');
    if (!el) return;
    var act = el.dataset.action;
    var id = el.dataset.id;
    try {
      switch (act) {
        case 'subnet-select': Store.act('subnet-select', id); break;
        case 'add-subnet': Dialog.promptSubnet(); break;
        case 'subnet-edit': ev.stopPropagation(); Dialog.promptSubnet(id); break;
        case 'subnet-delete': ev.stopPropagation(); Events.deleteSubnet(id); break;
        case 'open-ip': Panel.open(el.dataset.ip); break;
        case 'close-panel': Store.act('close-panel'); Panel.render(); break;
        case 'panel-save': Panel.save(); break;
        case 'panel-prev': Panel.step(-1); break;
        case 'panel-next': Panel.step(1); break;
        case 'panel-clear': Panel.clear(); break;
        case 'toggle-theme': Store.act('toggle-theme'); break;
        case 'filter': Store.act('set-filter', el.dataset.st === Store.state.ui.statusFilter ? '' : el.dataset.st); break;
        case 'export-json': IO.exportJSON(); break;
        case 'import-json': Events.pickFile('.json', function (f) { IO.importJSON(f); }); break;
        case 'import-table':
          if (!IO.hasDecompress) toast('当前浏览器不支持 xlsx 解压，仅可导入 CSV；JSON 备份仍可用', { err: true, ms: 5000 });
          Events.pickFile(IO.tableImportAccept(), function (f) { Wizard.open(f); });
          break;
        case 'netbox-sync': NetBox.open(); break;
        case 'status-rules': Rules.open(); break;
        case 'export-table': Events.exportTableMenu(ev); break;
        case 'restore-backup':
          Dialog.confirm('恢复备份', '将恢复到最近一次导入/恢复前的数据。继续？', function () { Data.restoreBackup(); }, '恢复');
          break;
      }
    } catch (e) {
      if (e instanceof CalcError || e.name === 'CalcError') toast(e.message, { err: true });
      else { console.error(e); toast('操作失败：' + (e.message || e), { err: true }); }
    }
  });
  // 状态分段按钮（点即存）
  $('#p-status').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-st]');
    if (b) Panel.quickStatus(b.dataset.st);
  });
  // 工具条
  $('#density').addEventListener('change', function (e) { Store.act('set-density', e.target.value); });
  $('#fontscale').addEventListener('change', function (e) { Store.act('set-font', e.target.value); });
  // 网段排序
  var sortSel = $('#subnet-sort');
  sortSel.value = Store.state.settings.subnetSort || 'created';
  sortSel.addEventListener('change', function (e) {
    Store.state.settings.subnetSort = e.target.value;
    Data.saveSettings();
    Render.subnetList();
  });
  // 格子多选（Ctrl/Shift + 左键）与右键菜单（事件委托在 #grid 上）
  var grid = $('#grid');
  grid.addEventListener('click', function (ev) {
    var cell = ev.target.closest('.cell[data-ip]');
    if (!cell) return;
    if (ev.ctrlKey || ev.metaKey || ev.shiftKey) {
      ev.preventDefault();
      ev.stopPropagation();
      Batch.toggle(cell.dataset.ip, ev.shiftKey ? 'range' : 'single');
      $('#ctx-menu').classList.remove('open');
    }
    // 普通左键由 document 委托的 open-ip 处理；批量模式下点击单格也加入选择
    else if (Batch.sel.length) {
      ev.preventDefault();
      ev.stopPropagation();
      Batch.toggle(cell.dataset.ip, 'single');
    }
  });
  grid.addEventListener('contextmenu', function (ev) {
    var cell = ev.target.closest('.cell[data-ip]');
    if (!cell) return;
    ev.preventDefault();
    var ip = cell.dataset.ip;
    // 右键未选中的格且已有批量选择 → 把该格并入
    if (Batch.sel.length && Batch.sel.indexOf(ip) < 0) { Batch.sel.push(ip); Batch.paint(); Batch.bar(); }
    Batch.menu(ev, ip);
  });
  document.addEventListener('click', function (ev) {
    var menu = $('#ctx-menu');
    if (menu.classList.contains('open') && !ev.target.closest('#ctx-menu')) menu.classList.remove('open');
  });
  // 批量条
  $('#batch-status').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-st]');
    if (b) Batch.apply(b.dataset.st);
  });
  $('#batch-cancel').addEventListener('click', function () { Batch.clear(); });
  // 搜索
  var search = $('#search');
  search.addEventListener('input', debounce(function () {
    Store.state.ui.search = search.value;
    Render.content();
  }, 120));
  // 键盘
  document.addEventListener('keydown', function (ev) {
    if (!$('#panel').classList.contains('open')) return;
    if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA' || ev.target.tagName === 'SELECT') return;
    if (ev.key === 'Escape') { Store.act('close-panel'); Panel.render(); }
    else if (ev.key === 'ArrowLeft') Panel.step(-1);
    else if (ev.key === 'ArrowRight') Panel.step(1);
    else if (ev.key === 'ArrowUp') Panel.step(-1);
    else if (ev.key === 'ArrowDown') Panel.step(1);
  });
  // 双标签页防护
  window.addEventListener('storage', function (ev) {
    if (ev.key === LS.data) {
      toast('数据已在其他窗口被修改，建议刷新页面加载最新数据', { ms: 8000, action: '刷新', onAction: function () { location.reload(); } });
    }
  });
};

/* ============================================================
 * [11] Selftest —— 内建自测（?selftest）
 * ============================================================ */
function runSelftest() {
  var cases = [];
  function t(name, fn) {
    try { fn(); cases.push([name, true, '']); }
    catch (e) { cases.push([name, false, e.message]); }
  }
  function eq(a, b, msg) { if (a !== b) throw new Error((msg || '') + ' 期望 ' + b + ' 实际 ' + a); }

  t('ipToUint 基本', function () { eq(Calc.ipToUint('192.168.1.1'), 3232235777); });
  t('ipToUint 边界 255', function () { eq(Calc.ipToUint('255.255.255.255'), 4294967295); });
  t('ipToUint 非法', function () { eq(Calc.ipToUint('256.1.1.1'), null); });
  t('uintToIp 往返', function () { eq(Calc.uintToIp(Calc.ipToUint('10.0.0.201')), '10.0.0.201'); });
  t('uintToIp 最大', function () { eq(Calc.uintToIp(4294967295), '255.255.255.255'); });
  t('parseCidr /24', function () {
    var r = Calc.parseCidr('192.168.10.0/24');
    eq(r.network, Calc.ipToUint('192.168.10.0'));
    eq(r.broadcast, Calc.ipToUint('192.168.10.255'));
    eq(r.total, 256);
  });
  t('parseCidr 主机位规范化', function () {
    var r = Calc.parseCidr('192.168.10.77/24');
    eq(r.network, Calc.ipToUint('192.168.10.0'));
    eq(r.hostBitsNonzero, true);
  });
  t('parseCidr /30', function () {
    var r = Calc.parseCidr('10.0.0.4/30');
    eq(r.total, 4);
    eq(Calc.uintToIp(r.broadcast), '10.0.0.7');
  });
  t('parseCidr /31', function () {
    var r = Calc.parseCidr('10.0.0.0/31');
    eq(r.total, 2);
    eq(Calc.roleOf(0, 2, 31), 'host');
    eq(Calc.roleOf(1, 2, 31), 'host');
  });
  t('parseCidr /32', function () {
    var r = Calc.parseCidr('10.0.0.5/32');
    eq(r.total, 1);
    eq(Calc.roleOf(0, 1, 32), 'host');
  });
  t('parseCidr /0', function () {
    var r = Calc.parseCidr('0.0.0.0/0');
    eq(r.total, 4294967296);
    eq(r.mask, 0);
  });
  t('parseCidr 非法格式', function () {
    var threw = false;
    try { Calc.parseCidr('abc'); } catch (e) { threw = true; }
    eq(threw, true);
  });
  t('roleOf 网络/广播', function () {
    eq(Calc.roleOf(0, 256, 24), 'network');
    eq(Calc.roleOf(255, 256, 24), 'broadcast');
    eq(Calc.roleOf(1, 256, 24), 'host');
  });
  t('usableCount', function () {
    eq(Calc.usableCount(256, 24), 254);
    eq(Calc.usableCount(2, 31), 2);
    eq(Calc.usableCount(1, 32), 1);
  });
  t('idxToIp', function () {
    eq(Calc.idxToIp(Calc.ipToUint('192.168.10.0'), 17), '192.168.10.17');
    eq(Calc.idxToIp(Calc.ipToUint('10.0.0.255'), 1), '10.0.1.0');
  });
  t('idxOfIp / 越界', function () {
    var net = Calc.ipToUint('192.168.10.0');
    var bc = Calc.ipToUint('192.168.10.255');
    eq(Calc.idxOfIp('192.168.10.5', net, bc), 5);
    eq(Calc.idxOfIp('192.168.11.5', net, bc), -1);
  });
  t('normalizeCidr', function () { eq(Calc.normalizeCidr('192.168.10.77/24'), '192.168.10.0/24'); });
  t('inSubnet 边界', function () {
    var net = Calc.ipToUint('10.0.0.0'), bc = Calc.ipToUint('10.0.0.7');
    eq(Calc.inSubnet('10.0.0.0', net, bc), true);
    eq(Calc.inSubnet('10.0.0.7', net, bc), true);
    eq(Calc.inSubnet('10.0.0.8', net, bc), false);
  });
  t('crc32 已知向量', function () {
    var u8 = new TextEncoder().encode('123456789');
    eq(IO.Xlsx.crc32(u8), 0xCBF43926);
  });
  t('crc32 空', function () { eq(IO.Xlsx.crc32(new Uint8Array(0)), 0); });
  t('CSV 引号转义', function () {
    var rows = IO.csvParse('a,"b,c","d""e""",\r\n1,2,3,4');
    eq(JSON.stringify(rows[0]), JSON.stringify(['a', 'b,c', 'd"e"', '']));
    eq(JSON.stringify(rows[1]), JSON.stringify(['1', '2', '3', '4']));
  });
  t('CSV 引号内换行', function () {
    var rows = IO.csvParse('"x\ny",z');
    eq(rows.length, 1);
    eq(rows[0][0], 'x\ny');
  });
  t('csvEncode 往返', function () {
    var orig = [['a,b', 'c"d', 'e']];
    var parsed = IO.csvParse(IO.csvEncode(orig));
    eq(JSON.stringify(parsed), JSON.stringify(orig));
  });
  t('colToIdx / idxToCol 往返', function () {
    eq(IO.Xlsx.idxToCol(0), 'A');
    eq(IO.Xlsx.idxToCol(25), 'Z');
    eq(IO.Xlsx.idxToCol(26), 'AA');
    eq(IO.Xlsx.colToIdx('AA'), 26);
  });
  t('zip 头签名', function () {
    var zip = IO.Xlsx.zipStore([['a.txt', 'hello']]);
    var dv = new DataView(zip.buffer);
    eq(dv.getUint32(0, true), 0x04034b50);
    eq(dv.getUint32(zip.length - 22, true), 0x06054b50);
  });
  t('zip 内容往返（parseZip 读取 STORE）', function () {
    var zip = IO.Xlsx.zipStore([['a.txt', 'hello world']]);
    return Promise.resolve(IO.Xlsx.parseZip(zip)).then(function (entries) {
      if (!entries.length || entries[0].name !== 'a.txt') throw new Error('条目名不符');
      if (new TextDecoder().decode(entries[0].data) !== 'hello world') throw new Error('内容不符');
    });
  });
  t('sheetXml 结构', function () {
    var xml = IO.Xlsx.sheetXml([['IP', '设备'], ['10.0.0.1', '路由器']]);
    if (xml.indexOf('t="inlineStr"') < 0) throw new Error('缺 inlineStr');
    if (xml.indexOf('路由器') < 0) throw new Error('缺中文内容');
  });
  t('esc 转义', function () { eq(esc('<b a="1">&\'</b>'), '&lt;b a=&quot;1&quot;&gt;&amp;&#39;&lt;/b&gt;'); });
  t('STATUS 关键词归一', function () {
    eq(/分配|在用|使用|占用|在线/.test('已分配'), true);
    eq(/预留|保留/.test('已预留'), true);
    eq(/冲突|异常|故障/.test('地址冲突'), true);
  });
  t('主机名列自动映射', function () {
    var m = Wizard.autoMap(['IP', '设备名称', 'Hostname']);
    eq(m.hostname, 2);
    eq(m.name, 1);
  });
  t('导出包含主机名列', function () {
    eq(IO.tableHeaders().indexOf('主机名') >= 0, true);
  });
  t('NetBox Worker 地址归一化', function () {
    eq(NetBox.normalizeProxy('https://proxy.example.workers.dev/'), 'https://proxy.example.workers.dev');
    eq(NetBox.normalizeProxy(''), '');
  });
  t('NetBox Worker 请求地址不携带 Token', function () {
    NetBox.state.proxy = 'https://proxy.example.workers.dev';
    var url = NetBox.proxyUrl('https://demo.netbox.dev/api/');
    eq(url.indexOf('token') < 0, true);
    eq(url.indexOf(encodeURIComponent('https://demo.netbox.dev/api/')) >= 0, true);
    NetBox.state.proxy = '';
  });
  t('NetBox Token 格式归一化', function () {
    var bearer = NetBox.parseToken('sample-value', 'Bearer');
    eq(bearer.auth, 'Bearer');
    eq(bearer.token, 'sample-value');
    var fullBearer = NetBox.parseToken('Bearer sample-value', 'Token');
    eq(fullBearer.auth, 'Bearer');
    eq(fullBearer.token, 'sample-value');
    var fullToken = NetBox.parseToken('Token sample-value', 'Bearer');
    eq(fullToken.auth, 'Token');
    eq(fullToken.token, 'sample-value');
    var rejected = false;
    try { NetBox.parseToken('sample value', 'Bearer'); } catch (e) { rejected = true; }
    eq(rejected, true);
  });
  t('NetBox 映射计划', function () {
    var oldState = Store.state;
    var oldMode = NetBox.state.conflictMode;
    Store.state = { data: { subnets: [{ id: 's1', name: '办公网', cidr: '10.0.0.0/30', note: '测试', ips: {
      '10.0.0.1': { status: 'assigned', hostname: 'host-1', note: '备注' },
      '10.0.0.2': { status: 'reserved' },
      '10.0.0.3': { status: 'free', name: '不应同步' }
    } }] } };
    NetBox.state.conflictMode = 'skip';
    var plan = NetBox.buildPlan({ prefixes: [], ips: [] });
    eq(plan.prefixes[0].action, 'create');
    eq(plan.ips.filter(function (x) { return x.key === '10.0.0.1'; })[0].payload.dns_name, 'host-1');
    eq(plan.ips.filter(function (x) { return x.key === '10.0.0.2'; })[0].payload.status, 'reserved');
    eq(plan.ips.filter(function (x) { return x.key === '10.0.0.3'; })[0].action, 'skip');
    Store.state = oldState;
    NetBox.state.conflictMode = oldMode;
  });
  t('NetBox 冲突映射', function () {
    var oldState = Store.state;
    var oldMode = NetBox.state.conflictMode;
    Store.state = { data: { subnets: [{ id: 's1', name: '', cidr: '10.0.0.0/30', note: '', ips: { '10.0.0.1': { status: 'conflict' } } }] } };
    NetBox.state.conflictMode = 'deprecated';
    var plan = NetBox.buildPlan({ prefixes: [], ips: [] });
    eq(plan.ips[0].payload.status, 'deprecated');
    eq(plan.ips[0].action, 'create');
    Store.state = oldState;
    NetBox.state.conflictMode = oldMode;
  });
  t('NetBox 更新携带远端 ID', function () {
    var oldState = Store.state;
    Store.state = { data: { subnets: [{
      id: 's1', name: '新网段名称', cidr: '10.0.0.0/30', note: '', _netbox: { id: 7 },
      ips: { '10.0.0.1': { status: 'assigned', hostname: 'new-host', _netbox: { id: 8 } } }
    }] } };
    NetBox.state.conflictMode = 'skip';
    var plan = NetBox.buildPlan({ prefixes: [{ id: 7, prefix: '10.0.0.0/30', description: '旧' }], ips: [{ id: 8, address: '10.0.0.1/32', status: 'active' }] });
    var jobs = NetBox.jobs(plan);
    eq(jobs.length, 2);
    eq(jobs[0].method, 'PATCH');
    eq(jobs[0].items[0].existing.id, 7);
    eq(jobs[1].items[0].existing.id, 8);
    Store.state = oldState;
  });

  var asyncPending = 0;
  var done = cases.length;
  var html = '<h3>IPViewer 自测</h3>';
  cases.forEach(function (c) {
    html += '<div class="' + (c[1] ? 'pass' : 'fail') + '">' + (c[1] ? '✓' : '✗') + ' ' + esc(c[0]) + (c[1] ? '' : ' — ' + esc(c[2])) + '</div>';
  });
  var pass = cases.filter(function (c) { return c[1]; }).length;
  html += '<h3>' + pass + ' / ' + cases.length + ' 通过</h3>';
  // 异步用例结果由 Promise 追加
  var box = document.createElement('div');
  box.id = 'selftest';
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--panel);color:var(--text);padding:20px;overflow:auto;max-height:70vh;border-bottom:3px solid var(--accent);font-family:Consolas,monospace;font-size:13px';
  box.innerHTML = html;
  document.body.appendChild(box);
  // 处理返回 Promise 的用例（zip 往返）
  cases.forEach(function (c, idx) { /* 同步结果已渲染 */ });
  // 重新跑异步断言并补渲染
  var asyncChecks = [];
  asyncChecks.push(new Promise(function (res) {
    var zip = IO.Xlsx.zipStore([['a.txt', 'hello world']]);
    IO.Xlsx.parseZip(zip).then(function (entries) {
      var ok = entries.length === 1 && entries[0].name === 'a.txt' && new TextDecoder().decode(entries[0].data) === 'hello world';
      appendResult('zip STORE 往返（异步）', ok);
      res();
    }).catch(function (e) { appendResult('zip STORE 往返（异步）', false, e.message); res(); });
  }));
  function appendResult(name, ok, msg) {
    var box = $('#selftest');
    var div = document.createElement('div');
    div.className = ok ? 'pass' : 'fail';
    div.textContent = (ok ? '✓' : '✗') + ' ' + name + (ok ? '' : ' — ' + msg);
    box.appendChild(div);
  }
  Promise.all(asyncChecks).then(function () {
    var box = $('#selftest');
    var all = box.querySelectorAll('.pass').length, tot = box.querySelectorAll('.pass,.fail').length;
    var h = box.querySelector('h3:last-of-type') || box.querySelector('h3');
    box.querySelectorAll('h3')[1].textContent = all + ' / ' + tot + ' 通过';
  });
}

/* ============================================================
 * [12] App —— 启动
 * ============================================================ */
function boot() {
  // 旧内核检测
  if (typeof Promise === 'undefined' || !document.createElement('dialog').showModal) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;font-size:16px">当前浏览器内核过旧，请使用 <b>Microsoft Edge</b> 或 Chrome 打开本工具。</div>';
    return;
  }
  Store.init();
  IO.updateCompatibilityUI();
  // 应用设置
  document.documentElement.style.setProperty('--cols', Store.state.settings.density);
  document.documentElement.style.setProperty('--cell-font', Store.state.settings.fontScale + 'px');
  $('#density').value = Store.state.settings.density;
  $('#fontscale').value = Store.state.settings.fontScale;
  Events.init();
  Store.sub(function () { Render.all(); Panel.render(); });
  Render.all();

  // ?selftest
  if (location.search.indexOf('selftest') >= 0) {
    runSelftest();
    // 自测模式下暴露内部句柄供自动化验证
    window.__test = { Store: Store, Render: Render, Panel: Panel, IO: IO, Data: Data, Calc: Calc, Wizard: Wizard, Rules: Rules, NetBox: NetBox };
  }
}
boot();

})();
</script>
</body>
